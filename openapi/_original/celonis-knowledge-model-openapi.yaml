        $ref:
          type: string
          format: uri-reference
    Components:
      type: object
      properties:
        schemas:
          type: object
          oneOf:
            - $ref: '#/components/schemas/Schema'
            - $ref: '#/components/schemas/Reference'
    Schema:
      type: object
      properties:
        title:
          type: string
        multipleOf:
          type: number
          minimum: 0
          exclusiveMinimum: true
        maximum:
          type: number
        exclusiveMaximum:
          type: boolean
          default: false
        minimum:
          type: number
        exclusiveMinimum:
          type: boolean
          default: false
        maxLength:
          type: integer
          minimum: 0
        minLength:
          type: integer
          minimum: 0
          default: 0
        pattern:
          type: string
          format: regex
        maxItems:
          type: integer
          minimum: 0
        minItems:
          type: integer
          minimum: 0
          default: 0
        uniqueItems:
          type: boolean
          default: false
        maxProperties:
          type: integer
          minimum: 0
        minProperties:
          type: integer
          minimum: 0
          default: 0
        required:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        enum:
          type: array
          items: {}
          minItems: 1
          uniqueItems: false
        type:
          type: string
          enum:
            - array
            - boolean
            - integer
            - number
            - object
            - string
        not:
          oneOf:
            - $ref: '#/components/schemas/Schema'
            - $ref: '#/components/schemas/Reference'
        allOf:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Schema'
              - $ref: '#/components/schemas/Reference'
        oneOf:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Schema'
              - $ref: '#/components/schemas/Reference'
        anyOf:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Schema'
              - $ref: '#/components/schemas/Reference'
        items:
          oneOf:
            - $ref: '#/components/schemas/Schema'
            - $ref: '#/components/schemas/Reference'
        properties:
          type: object
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/Schema'
              - $ref: '#/components/schemas/Reference'
        additionalProperties:
          oneOf:
            - $ref: '#/components/schemas/Schema'
            - $ref: '#/components/schemas/Reference'
            - type: boolean
          default: true
        description:
          type: string
        format:
          type: string
        default: {}
        nullable:
          type: boolean
          default: false
        example: {}
      additionalProperties: false
    Paths:
      type: object
      additionalProperties: false
    SecurityRequirement:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    KmQueryDataRequest:
      required:
        - projection
      type: object
      properties:
        projection:
          $ref: '#/components/schemas/Projection'
      description: The top-level request object for querying the Knowledge Model.
    KmQueryRecordDataRequest:
      required:
        - projection
      type: object
      properties:
        projection:
          $ref: '#/components/schemas/KmRecordDataRequestProjection'
      description: The top-level request records for querying the Knowledge Model.
    KmRecordDataRequestProjection:
      required:
        - fields
      type: object
      properties:
        fields:
          $ref: '#/components/schemas/KmRecordFieldsProjection'
        filters:
          $ref: '#/components/schemas/FiltersProjection'
        pagination:
          $ref: '#/components/schemas/KmPaginationProjection'
        sort:
          $ref: '#/components/schemas/SortProjectionRecord'
        options:
          $ref: '#/components/schemas/KmOptionsProjection'
        search:
          $ref: '#/components/schemas/SearchProjection'
      description: >-
        Defines the parameters related to the query to be executed against the
        Knowledge Model Record.
    Projection:
      type: object
      properties:
        fields:
          $ref: '#/components/schemas/KmRecordFieldsProjection'
        filters:
          $ref: '#/components/schemas/FiltersProjection'
        pagination:
          $ref: '#/components/schemas/KmPaginationProjection'
        sort:
          $ref: '#/components/schemas/SortProjectionKm'
        options:
          $ref: '#/components/schemas/KmOptionsProjection'
        kpis:
          $ref: '#/components/schemas/KpisProjection'
        search:
          $ref: '#/components/schemas/SearchProjection'
      description: Defines the projection criteria for the Knowledge Model query.
    KmRecordFieldsProjection:
      maxLength: 2048
      minLength: 1
      type: string
      description: >-
        Projection of KM Record fields expressed as a comma separated list of
        Record Fields names to be used.
      nullable: false
      example: material_name,material_number,material_group
    FiltersProjection:
      type: object
      properties:
        kmFilterNames:
          type: array
          description: List of predefined Knowledge Model filter names to apply.
          example:
            - filter1
            - filter2
            - filter3
          items:
            type: string
        filterExpr:
          type: array
          description: List of raw filter expressions (e.g., OData syntax).
          example:
            - active eq true and name ne 'John Doe'
          items:
            type: string
      description: Defines filtering criteria for the Knowledge Model query.
    KmPaginationProjection:
      type: object
      properties:
        pageNumber:
          minimum: 0
          type: integer
          description: Page number of the result, starting by 0 (first page).
          format: int32
          default: 0
        pageSize:
          minimum: 1
          type: integer
          description: Page size of the result, the number of items returned in a page.
          format: int32
          default: 50
      description: >-
        Projection of pagination parameters to be used, expressed as a page
        number and a page size.
    SortProjectionKm:
      description: >-
        Defines the order in which results are returned (Knowledge Model–level
        query body).


        The `sort` property must be a comma-separated list of record fields
        and/or KPIs.

        Any value used in `sort` **must also be included** in the `fields` or
        `kpis` properties.

        If a value appears in `sort` but is **not** included in `fields` or
        `kpis`, the API cannot evaluate it and sorting will not be applied
        correctly.


        If a non-existing field is provided, the request will return an error.


        Sort direction is specified using optional prefixes:

        - `+` for ascending order (ASC)

        - `-` for descending order (DESC)

        - No prefix defaults to ascending order (ASC)


        **Examples** (string value in `projection.sort`)

        - `+record1_id.field1` (sorting in ascending order by a record field)

        - `-record1_id.field2,kpi1` (sorting in descending order by a record
        field and in ascending order by a KPI)

        - `record1_id.field1,-kpi2` (sorting in ascending order by a record
        field and in descending order by a KPI)

        - `-kpi1` (sorting in descending order by a KPI)
      type: string
      minLength: 2
      maxLength: 2048
      nullable: true
      example: +record1_id.field1,-record1_id.field2,kpi1
    SortProjectionRecord:
      description: >-
        Defines the order in which results are returned (record-level query
        body).


        The `sort` property must be a comma-separated list of record fields.

        Any value used in `sort` **must also be included** in the `fields`
        property.

        If a value appears in `sort` but is **not** included in `fields`, the
        API cannot evaluate it and sorting will not be applied correctly.


        If a non-existing field is provided, the request will return an error.


        Sort direction is specified using optional prefixes:

        - `+` for ascending order (ASC)

        - `-` for descending order (DESC)

        - No prefix defaults to ascending order (ASC)


        **Examples** (string value in `projection.sort`)

        - `+field1` (sorting in ascending order by a record field)

        - `-field2,field1` (sorting in descending order by a record field and in
        ascending order by another record field)
      type: string
      minLength: 2
      maxLength: 2048
      nullable: true
      example: +field1,-field2,field3
    KmOptionsProjection:
      maxItems: 1
      minItems: 0
      type: array
      description: Set different options to customize the data results for a projection.
      nullable: true
      items:
        $ref: '#/components/schemas/KmOptionsValues'
    KmOptionsValues:
      type: string
      description: >
        Set different **options to customize the data results** for a query.
        Supported options 

        * **Distinct**: Enable the unique data results for a query
      enum:
        - distinct
    KpisProjection:
      type: array
      description: List of KPIs.
      items:
        type: string
    SearchProjection:
      type: object
      properties:
        term:
          type: string
          description: The search term or keyword.
          example: tot_revenue
        field:
          type: string
          description: >-
            Optional specific field to search within. If omitted, searches
            across all relevant fields.
          example: revenue
        precision:
          maximum: 100
          minimum: 0
          type: integer
          description: The precision level for the search (e.g., fuzzy matching tolerance).
          format: int32
          example: 10
      description: Defines search criteria for full-text search or specific field search.
  parameters:
    filtersParam:
      style: form
      explode: false
      in: query
      name: filters
      required: false
      schema:
        type: array
        items:
          type: string
          description: A predefined filter id
          example: active_incidents,cel_and_kpi
    fieldsParam:
      style: form
      explode: false
      in: query
      name: fields
      required: true
      allowEmptyValue: false
      schema:
        type: array
        items:
          type: string
          description: A predefined filter id
          example: active,approval
    fieldsOptionalParam:
      style: form
      explode: false
      in: query
      name: fields
      required: false
      allowEmptyValue: false
      schema:
        type: array
        items:
          type: string
          description: A predefined filter id
          example: active,approval
    recordFieldsParam:
      style: form
      explode: false
      in: query
      name: fields
      required: true
      allowEmptyValue: false
      schema:
        type: array
        items:
          type: string
          description: Record Field Id, separated by "."
          example: record1_id.field1_id,record1_id.field2_id,record2_id.fieldN_id
    filterExprParam:
      style: form
      explode: true
      in: query
      name: filterExpr
      required: false
      schema:
        type: array
        items:
          type: string
          description: Dynamic filter expressions
          example: active eq true and name not eq 'John Doe'
    pageParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        description: The page number of the result, starting by 0 (first page)
    pageSizeParam:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
        description: The number of items returned in a page.
    sortParamKm:
      style: form
      explode: false
      in: query
      name: sort
      required: false
      description: >-
        Defines the order in which results are returned (Knowledge Model–level
        GET).


        The `sortParamKm` query parameter must be a comma-separated list of
        record fields and/or KPIs.

        Any value used in `sortParamKm` **must also be included** in the
        `fields` or `kpis` parameters.

        If a value appears in `sortParamKm` but is **not** included in `fields`
        or `kpis`, the API cannot evaluate it and sorting will not be applied
        correctly.


        If a non-existing field is provided, the request will return an error.


        Sort direction is specified using optional prefixes:

        - `+` for ascending order (ASC)

        - `-` for descending order (DESC)

        - No prefix defaults to ascending order (ASC)


        **Examples**

        - `sortParamKm=+record1_id.field1` (sorting in ascending order by a
        record field)

        - `sortParamKm=-record1_id.field2,kpi1` (sorting in descending order by
        a record field and in ascending order by a KPI)

        - `sortParamKm=record1_id.field1,-kpi2` (sorting in ascending order by a
        record field and in descending order by a KPI)

        - `sortParamKm=-kpi1` (sorting in descending order by a KPI)
      schema:
        type: array
        items:
          type: string
          example: +record1_id.field1,-record1_id.field2,kpi1
    sortParamRecord:
      style: form
      explode: false
      in: query
      name: sort
      required: false
      description: >-
        Defines the order in which results are returned (record-level GET).


        The `sortParamRecord` query parameter must be a comma-separated list of
        record fields.

        Any value used in `sortParamRecord` **must also be included** in the
        `fields` parameter.

        If a value appears in `sortParamRecord` but is **not** included in
        `fields`, the API cannot evaluate it and sorting will not be applied
        correctly.


        If a non-existing field is provided, the request will return an error.


        Sort direction is specified using optional prefixes:

        - `+` for ascending order (ASC)

        - `-` for descending order (DESC)

        - No prefix defaults to ascending order (ASC)


        **Examples**

        - `sortParamRecord=+field1` (sorting in ascending order by a record
        field)

        - `sortParamRecord=-field2,field1` (sorting in descending order by a
        record field and in ascending order by another record field)
      schema:
        type: array
        items:
          type: string
          example: +field1,-field2,field3
    singleSortParam:
      style: form
      explode: false
      in: query
      name: sort
      required: false
      description: >-
        Defines the strategy to proceed for case insensitive sorting. It must be
        just one field, and it should start with "+" to apply ASC order or "-"
        to apply DESC order. Non prefix will sort as ASC. Non existing field at
        the header will throw an error
      schema:
        type: string
        example:
          - '-field1'
    options:
      style: form
      explode: false
      in: query
      name: options
      required: false
      description: >
        Set different **options to customize the data results** for a query.
        Supported options 

        * **Distinct**: Enable the unique data results for a query
      schema:
        type: array
        items:
          type: string
          example: distinct
    kpisParam:
      style: form
      explode: false
      in: query
      name: kpis
      required: false
      schema:
        type: array
        items:
          type: string
          description: As many kpi ids if they exists in the knowledge model
          example: AVG_EVENTS_PER_CASE,FILTERED_COUNT
    excludFieldsOptionalParam:
      style: form
      explode: false
      in: query
      name: excludeFields
      required: false
      allowEmptyValue: false
      schema:
        type: array
        items:
          type: string
          description: Field id from a record
          example: active,approval
    searchTerm:
      in: query
      name: searchTerm
      required: false
      schema:
        type: string
        description: >-
          The term to search for. The search will attempt to find matches that
          are similar to this term.
    searchPrecision:
      in: query
      name: searchPrecision
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        description: >-
          The strictness of the fuzzy matching algorithm. A lower value will
          return less accurate matches (more 'fuzzy').
    searchField:
      in: query
      name: searchField
      required: false
      schema:
        type: string
        description: >-
          The specific field within the data structure that is targeted by the
          search.
    sampleSizeParam:
      in: query
      name: sampleSize
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
        description: The number of items returned in a sample.
    odataSelectParam:
      in: query
      name: $select
      required: false
      schema:
        type: array
        items:
          type: string
          description: >-
            The $select system query option allows clients to request a specific
            set of properties for each entity or complex type.
          example: active,approval
    odataFormatParam:
      in: query
      name: $format
      required: false
      schema:
        type: string
        description: >-
          The $format system query option allows clients to request a response
          in a particular format and is useful for clients without access to
          request headers for standard content-type negotiation.
        example: json
    odataTopParam:
      in: query
      name: $top
      required: false
      schema:
        type: integer
        description: >-
          The $top system query option requests the number of items in the
          queried collection to be included in the result.
        example: 10
    odataSkipParam:
      in: query
      name: $skip
      required: false
      schema:
        type: integer
        description: >-
          The $skip query option requests the number of items in the queried
          collection that are to be skipped and not included in the result.
        example: 100
    odataCountParam:
      in: query
      name: $count
      required: false
      schema:
        type: boolean
        description: >-
          The $count system query option allows clients to request a count of
          the matching resources included with the resources in the response.
          The $count query option has a Boolean value of true or false.
        example: true
    odataOrderByParam:
      in: query
      name: $orderby
      required: false
      schema:
        type: string
        description: >-
          The $orderby system query option allows clients to request resources
          in a particular order.
        example: field1
    odataFilterParam:
      in: query
      name: $filter
      required: false
      schema:
        type: string
        description: >-
          The $filter system query option allows clients to filter a collection
          of resources that are addressed by a request URL.
        example: field1 eq 'value1'
    odataFilterIdParam:
      in: query
      name: filterid
      required: false
      schema:
        type: string
        description: >-
          The filterid is a custom query option allows clients to filter a
          collection of resources using pre-defined knowledge model filter.
        example: filterid
  responses:
    Ok:
      description: The resource has been fetched and transmitted in the message body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/resultPage'
    BadRequest:
      description: Bad Request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/errorDTO'
    Unauthorized:
      description: Unauthorized access.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/authErrorDTO'
    Forbidden:
      description: Forbidden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/errorDTO'
    NotFound:
      description: The specified resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/errorDTO'
    NotSupportedFormat:
      description: Unsupported media type requested.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/errorDTO'
    TooManyRequests:
      description: Too Many Requests.
      headers:
        X-RateLimit-Limit:
          description: Request limit per hour.
          schema:
            type: integer
            format: int32
        X-RateLimit-Remaining:
          description: The number of requests left for the time window.
          schema:
            type: integer
            format: int32
        X-RateLimit-Reset:
          description: The UTC date/time at which the current rate limit window resets.
          schema:
            type: string
            format: date-time
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/errorDTO'
    InternalError:
      description: Internal Server Error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/errorDTO'
    ServiceUnavailable:
      description: Service Unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/errorDTO'
