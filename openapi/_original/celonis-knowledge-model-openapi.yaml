    openApiSpecDTO:
      properties:
        openapi:
          type: string
          pattern: ^3\.0\.\d(-.+)?$
        info:
          type: object
          required:
            - title
            - version
          properties:
            title:
              type: string
            description:
              type: string
            termsOfService:
              type: string
              format: uri-reference
            contact:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri-reference
            version:
              type: string
            x-audience:
              type: string
              example: EX
        servers:
          type: array
          items:
            type: object
            required:
              - url
            properties:
              url:
                type: string
        security:
          type: array
          items:
            $ref: '#/components/schemas/SecurityRequirement'
        paths:
          $ref: '#/components/schemas/Paths'
        components:
          $ref: '#/components/schemas/Components'
    Reference:
