aid: celonis
name: Celonis
description: >-
  Celonis is the process intelligence and process mining company. Its cloud platform
  ingests event data from enterprise systems, builds Knowledge Models of how business
  processes actually run, and surfaces KPIs, bottlenecks and automation opportunities.
  For developers Celonis publishes a Developer Center with REST APIs across Process
  Intelligence (Knowledge Model, AI Agent, Event Subscription), data ingestion and
  push, Machine Learning Workbench, Team, Permissions and SCIM, plus an official
  hosted Agent Tools (MCP) server, the PyCelonis Python SDK and the content-cli. Auth
  is via OAuth 2.0 (recommended) or API keys, with page-based pagination, x-ratelimit
  signaling and OData-style querying on the Knowledge Model API.
